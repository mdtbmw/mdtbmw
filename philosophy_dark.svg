<svg xmlns="http://www.w3.org/2000/svg" width="1125" height="490" viewBox="0 0 1125 490" role="img" aria-label="Building Philosophy - First-Principles Engineering and Systems Design">
  <rect x="0.5" y="0.5" width="1124" height="489" rx="10" fill="#0d1117" stroke="#30363d"/>

  <!-- Section Header -->
  <text x="36" y="36" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="14"><tspan fill="#3d444d">─</tspan><tspan fill="#FFE873"> Building Philosophy · First-Principles Systems Design </tspan><tspan fill="#3d444d">────────────────────</tspan></text>

  <!-- Horizontal Pipeline Bar -->
  <rect x="36" y="54" width="1053" height="34" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="76" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="11.5"><tspan fill="#8b949e">Problem</tspan><tspan fill="#FFE873"> ──► </tspan><tspan fill="#c9d1d9">Idea</tspan><tspan fill="#FFE873"> ──► </tspan><tspan fill="#c9d1d9">Structure</tspan><tspan fill="#FFE873"> ──► </tspan><tspan fill="#c9d1d9">Design</tspan><tspan fill="#FFE873"> ──► </tspan><tspan fill="#c9d1d9">Build</tspan><tspan fill="#FFE873"> ──► </tspan><tspan fill="#c9d1d9">System</tspan><tspan fill="#FFE873"> ──► </tspan><tspan fill="#c9d1d9">Operation</tspan><tspan fill="#FFE873"> ──► </tspan><tspan fill="#FFF3B0" font-weight="bold">Growth</tspan></text>

  <!-- Left Column Card: Principles 01-05 -->
  <rect x="36" y="100" width="516" height="340" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="54" y="128" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="13" font-weight="bold"><tspan fill="#FFE873">ARCHITECTURE &amp; SYSTEMS</tspan></text>

  <text x="54" y="158" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12" font-weight="bold"><tspan fill="#FFE873">01.</tspan><tspan fill="#c9d1d9"> Solve the real problem first</tspan></text>
  <text x="78" y="176" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="11"><tspan fill="#8b949e">Not the symptom. Not the assumed cause. The actual root problem.</tspan></text>

  <text x="54" y="212" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12" font-weight="bold"><tspan fill="#FFE873">02.</tspan><tspan fill="#c9d1d9"> Don't overengineer prematurely</tspan></text>
  <text x="78" y="230" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="11"><tspan fill="#8b949e">Complexity must be earned by necessity, not introduced by habit.</tspan></text>

  <text x="54" y="266" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12" font-weight="bold"><tspan fill="#FFE873">03.</tspan><tspan fill="#c9d1d9"> Make complex systems simple for users</tspan></text>
  <text x="78" y="284" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="11"><tspan fill="#8b949e">Sophistication lives in architecture; simplicity lives in interface.</tspan></text>

  <text x="54" y="320" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12" font-weight="bold"><tspan fill="#FFE873">04.</tspan><tspan fill="#c9d1d9"> Build systems, not isolated features</tspan></text>
  <text x="78" y="338" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="11"><tspan fill="#8b949e">A feature solves one thing; a system solves an entire category.</tspan></text>

  <text x="54" y="374" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12" font-weight="bold"><tspan fill="#FFE873">05.</tspan><tspan fill="#c9d1d9"> Design with operations in mind</tspan></text>
  <text x="78" y="392" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="11"><tspan fill="#8b949e">A product that works but cannot be maintained is an active liability.</tspan></text>

  <!-- Right Column Card: Principles 06-10 -->
  <rect x="573" y="100" width="516" height="340" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="591" y="128" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="13" font-weight="bold"><tspan fill="#FFE873">EXECUTION &amp; SUSTAINABILITY</tspan></text>

  <text x="591" y="158" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12" font-weight="bold"><tspan fill="#FFE873">06.</tspan><tspan fill="#c9d1d9"> Technology must serve the business</tspan></text>
  <text x="615" y="176" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="11"><tspan fill="#8b949e">The stack is a tool. Measurable business outcome is the point.</tspan></text>

  <text x="591" y="212" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12" font-weight="bold"><tspan fill="#FFE873">07.</tspan><tspan fill="#c9d1d9"> Good interfaces reduce cognitive load</tspan></text>
  <text x="615" y="230" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="11"><tspan fill="#8b949e">If a user has to think hard about how to use it, the design failed.</tspan></text>

  <text x="591" y="266" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12" font-weight="bold"><tspan fill="#FFE873">08.</tspan><tspan fill="#c9d1d9"> A product is more than its code</tspan></text>
  <text x="615" y="284" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="11"><tspan fill="#8b949e">Onboarding, documentation, support, infrastructure — all part of it.</tspan></text>

  <text x="591" y="320" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12" font-weight="bold"><tspan fill="#FFE873">09.</tspan><tspan fill="#c9d1d9"> Scalability begins with good structure</tspan></text>
  <text x="615" y="338" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="11"><tspan fill="#8b949e">You cannot scale chaos. Build the foundation right before adding weight.</tspan></text>

  <text x="591" y="374" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12" font-weight="bold"><tspan fill="#FFE873">10.</tspan><tspan fill="#c9d1d9"> Automation should free human judgment</tspan></text>
  <text x="615" y="392" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="11"><tspan fill="#8b949e">Remove mechanical friction. Preserve &amp; amplify human intelligence.</tspan></text>

  <!-- Footer Principle -->
  <text x="36" y="468" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12"><tspan fill="#FFE873">◈ </tspan><tspan fill="#8b949e">Guiding Rule: </tspan><tspan fill="#c9d1d9">"I don't start with 'What tech should we use?'. I start with 'What problem are we actually solving?'"</tspan></text>
</svg>
