  <!-- Left Column: About & Focus Text (No Emojis, No Location Traces) -->
  <text x="36" y="44" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="14"><tspan fill="#d0d7de">─</tspan><tspan fill="#0969da"> Daniel Innocent · MDTBMW </tspan><tspan fill="#d0d7de">────────────────────────────</tspan></text>

  <text x="36" y="72" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="13"><tspan fill="#24292f">I'm </tspan><tspan fill="#9a6700" font-weight="bold">Daniel Innocent</tspan><tspan fill="#24292f"> — known as </tspan><tspan fill="#953800" font-weight="bold">Masked Daniel</tspan><tspan fill="#24292f">, operating as </tspan><tspan fill="#0969da" font-weight="bold">MDTBMW</tspan><tspan fill="#24292f">.</tspan></text>
  <text x="36" y="94" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="13"><tspan fill="#24292f">Digital Solutions Expert &amp; Systems Architect, and founder behind</tspan></text>
  <text x="36" y="116" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="13"><tspan fill="#9a6700">HeyTek Limited</tspan><tspan fill="#24292f"> — make business simple through tech &amp; systems.</tspan></text>

  <text x="36" y="146" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="13"><tspan fill="#24292f">I work across product design, web dev, business systems, automation,</tspan></text>
  <text x="36" y="168" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="13"><tspan fill="#24292f">AI, &amp; creative strategy from idea to scalable operating business.</tspan></text>

  <text x="36" y="198" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="13"><tspan fill="#57606a">"Building scalable systems from first principles to market leadership."</tspan></text>

