  <text x="36" y="264" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="13"><tspan fill="#953800">01. Systems Thinker </tspan><tspan fill="#8c959f">.....</tspan><tspan fill="#24292f"> Frameworks, processes, patterns &amp; scale</tspan></text>
  <text x="36" y="290" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="13"><tspan fill="#953800">02. End-to-End Builder </tspan><tspan fill="#8c959f">..</tspan><tspan fill="#24292f"> Design, dev, operations &amp; business strategy</tspan></text>
  <text x="36" y="316" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="13"><tspan fill="#953800">03. Global Scaling </tspan><tspan fill="#8c959f">......</tspan><tspan fill="#24292f"> Digital infrastructure for worldwide markets</tspan></text>
  <text x="36" y="342" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="13"><tspan fill="#953800">04. Mentorship &amp; Org </tspan><tspan fill="#8c959f">....</tspan><tspan fill="#24292f"> Digital literacy, leadership &amp; ecosystems</tspan></text>
