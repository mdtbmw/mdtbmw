<svg xmlns="http://www.w3.org/2000/svg" width="1125" height="490" viewBox="0 0 1125 490" role="img" aria-label="Building Philosophy - First-Principles Engineering and Systems Design">
  <rect x="0.5" y="0.5" width="1124" height="489" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Section Header -->
  <text x="36" y="36" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="14"><tspan fill="#d0d7de">─</tspan><tspan fill="#B78103"> Building Philosophy · First-Principles Systems Design </tspan><tspan fill="#d0d7de">────────────────────</tspan></text>

  <!-- Horizontal Pipeline Bar -->
  <rect x="36" y="54" width="1053" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="50" y="76" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="11.5"><tspan fill="#57606a">Problem</tspan><tspan fill="#B78103"> ──► </tspan><tspan fill="#24292f">Idea</tspan><tspan fill="#B78103"> ──► </tspan><tspan fill="#24292f">Structure</tspan><tspan fill="#B78103"> ──► </tspan><tspan fill="#24292f">Design</tspan><tspan fill="#B78103"> ──► </tspan><tspan fill="#24292f">Build</tspan><tspan fill="#B78103"> ──► </tspan><tspan fill="#24292f">System</tspan><tspan fill="#B78103"> ──► </tspan><tspan fill="#24292f">Operation</tspan><tspan fill="#B78103"> ──► </tspan><tspan fill="#8C6500" font-weight="bold">Growth</tspan></text>

  <!-- Left Column Card: Principles 01-05 -->
  <rect x="36" y="100" width="516" height="340" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="54" y="128" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="13" font-weight="bold"><tspan fill="#B78103">ARCHITECTURE &amp; SYSTEMS</tspan></text>

  <text x="54" y="158" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12" font-weight="bold"><tspan fill="#B78103">01.</tspan><tspan fill="#24292f"> Solve the real problem first</tspan></text>
  <text x="78" y="176" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="11"><tspan fill="#57606a">Not the symptom. Not the assumed cause. The actual root problem.</tspan></text>

  <text x="54" y="212" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12" font-weight="bold"><tspan fill="#B78103">02.</tspan><tspan fill="#24292f"> Don't overengineer prematurely</tspan></text>
  <text x="78" y="230" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="11"><tspan fill="#57606a">Complexity must be earned by necessity, not introduced by habit.</tspan></text>

  <text x="54" y="266" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12" font-weight="bold"><tspan fill="#B78103">03.</tspan><tspan fill="#24292f"> Make complex systems simple for users</tspan></text>
  <text x="78" y="284" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="11"><tspan fill="#57606a">Sophistication lives in architecture; simplicity lives in interface.</tspan></text>

  <text x="54" y="320" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12" font-weight="bold"><tspan fill="#B78103">04.</tspan><tspan fill="#24292f"> Build systems, not isolated features</tspan></text>
  <text x="78" y="338" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="11"><tspan fill="#57606a">A feature solves one thing; a system solves an entire category.</tspan></text>

  <text x="54" y="374" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12" font-weight="bold"><tspan fill="#B78103">05.</tspan><tspan fill="#24292f"> Design with operations in mind</tspan></text>
  <text x="78" y="392" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="11"><tspan fill="#57606a">A product that works but cannot be maintained is an active liability.</tspan></text>

  <!-- Right Column Card: Principles 06-10 -->
  <rect x="573" y="100" width="516" height="340" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="591" y="128" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="13" font-weight="bold"><tspan fill="#B78103">EXECUTION &amp; SUSTAINABILITY</tspan></text>

  <text x="591" y="158" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12" font-weight="bold"><tspan fill="#B78103">06.</tspan><tspan fill="#24292f"> Technology must serve the business</tspan></text>
  <text x="615" y="176" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="11"><tspan fill="#57606a">The stack is a tool. Measurable business outcome is the point.</tspan></text>

  <text x="591" y="212" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12" font-weight="bold"><tspan fill="#B78103">07.</tspan><tspan fill="#24292f"> Good interfaces reduce cognitive load</tspan></text>
  <text x="615" y="230" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="11"><tspan fill="#57606a">If a user has to think hard about how to use it, the design failed.</tspan></text>

  <text x="591" y="266" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12" font-weight="bold"><tspan fill="#B78103">08.</tspan><tspan fill="#24292f"> A product is more than its code</tspan></text>
  <text x="615" y="284" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="11"><tspan fill="#57606a">Onboarding, documentation, support, infrastructure — all part of it.</tspan></text>

  <text x="591" y="320" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12" font-weight="bold"><tspan fill="#B78103">09.</tspan><tspan fill="#24292f"> Scalability begins with good structure</tspan></text>
  <text x="615" y="338" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="11"><tspan fill="#57606a">You cannot scale chaos. Build the foundation right before adding weight.</tspan></text>

  <text x="591" y="374" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12" font-weight="bold"><tspan fill="#B78103">10.</tspan><tspan fill="#24292f"> Automation should free human judgment</tspan></text>
  <text x="615" y="392" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="11"><tspan fill="#57606a">Remove mechanical friction. Preserve &amp; amplify human intelligence.</tspan></text>

  <!-- Footer Principle -->
  <text x="36" y="468" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12"><tspan fill="#B78103">◈ </tspan><tspan fill="#57606a">Guiding Rule: </tspan><tspan fill="#24292f">"I don't start with 'What tech should we use?'. I start with 'What problem are we actually solving?'"</tspan></text>
</svg>
