  <!-- Left Column: About & Focus Text (No Emojis, No Location Traces) -->
  <text x="36" y="44" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="14"><tspan fill="#3d444d">─</tspan><tspan fill="#58a6ff"> Daniel Innocent · MDTBMW </tspan><tspan fill="#3d444d">────────────────────────────</tspan></text>

  <text x="36" y="72" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="13"><tspan fill="#c9d1d9">I'm </tspan><tspan fill="#FFD700" font-weight="bold">Daniel Innocent</tspan><tspan fill="#c9d1d9"> — known as </tspan><tspan fill="#ffa657" font-weight="bold">Masked Daniel</tspan><tspan fill="#c9d1d9">, operating as </tspan><tspan fill="#58a6ff" font-weight="bold">MDTBMW</tspan><tspan fill="#c9d1d9">.</tspan></text>
  <text x="36" y="94" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="13"><tspan fill="#c9d1d9">Digital Solutions Expert &amp; Systems Architect, and founder behind</tspan></text>
  <text x="36" y="116" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="13"><tspan fill="#FFD700">HeyTek Limited</tspan><tspan fill="#c9d1d9"> — make business simple through tech &amp; systems.</tspan></text>

  <text x="36" y="146" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="13"><tspan fill="#c9d1d9">I work across product design, web dev, business systems, automation,</tspan></text>
  <text x="36" y="168" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="13"><tspan fill="#c9d1d9">AI, &amp; creative strategy from idea to scalable operating business.</tspan></text>

  <text x="36" y="198" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="13"><tspan fill="#8b949e">"Building scalable systems from first principles to market leadership."</tspan></text>

  <!-- Focus Section -->
  <text x="36" y="236" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="14"><tspan fill="#3d444d">─</tspan><tspan fill="#58a6ff"> Focus &amp; Core Capabilities </tspan><tspan fill="#3d444d">───────────────────────────</tspan></text>

  <text x="36" y="264" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="13"><tspan fill="#ffa657">01. Systems Thinker </tspan><tspan fill="#484f58">.....</tspan><tspan fill="#c9d1d9"> Frameworks, processes, patterns &amp; scale</tspan></text>
  <text x="36" y="290" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="13"><tspan fill="#ffa657">02. End-to-End Builder </tspan><tspan fill="#484f58">..</tspan><tspan fill="#c9d1d9"> Design, dev, operations &amp; business strategy</tspan></text>
  <text x="36" y="316" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="13"><tspan fill="#ffa657">03. Global Scaling </tspan><tspan fill="#484f58">......</tspan><tspan fill="#c9d1d9"> Digital infrastructure for worldwide markets</tspan></text>
  <text x="36" y="342" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="13"><tspan fill="#ffa657">04. Mentorship &amp; Org </tspan><tspan fill="#484f58">....</tspan><tspan fill="#c9d1d9"> Digital literacy, leadership &amp; ecosystems</tspan></text>
  <text x="36" y="368" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="13"><tspan fill="#ffa657">05. Creative Strategy </tspan><tspan fill="#484f58">...</tspan><tspan fill="#c9d1d9"> Storytelling, media &amp; brand architecture</tspan></text>

