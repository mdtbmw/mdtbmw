  <text x="36" y="462" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12"><tspan fill="#FFE873">◈ </tspan><tspan fill="#8b949e">Core Principle: </tspan><tspan fill="#c9d1d9">"Ideas without systems are dreams. Systems without ideas are machinery. IBOG executes where both meet."</tspan></text>
