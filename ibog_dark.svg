  <text x="54" y="206" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12"><tspan fill="#8b949e">. Focus: ... </tspan><tspan fill="#c9d1d9">Eliminating ambiguity before code is written</tspan></text>
