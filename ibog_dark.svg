  <text x="54" y="158" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12"><tspan fill="#8b949e">. Mandate: </tspan><tspan fill="#c9d1d9">Turning raw problems into clear technical concepts</tspan></text>
