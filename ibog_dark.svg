  <text x="591" y="380" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12"><tspan fill="#8b949e">. Focus: ... </tspan><tspan fill="#c9d1d9">Transforming a working product into an enterprise</tspan></text>
